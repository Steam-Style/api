services:
  api:
    build: .
    container_name: "steam-style-api"
    environment:
      - DATABASE_URL=${DATABASE_URL:?}
      - COLLECTION_NAME=${COLLECTION_NAME:-Steam-Style-Items}
      - DEVICE=${DEVICE:-cpu}
      - MODEL_NAME=${MODEL_NAME:-google/siglip2-base-patch16-224}
    expose:
      - "8000"
    healthcheck:
      test: [
          "CMD",
          "python",
          "-c",
          "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    tty: true
